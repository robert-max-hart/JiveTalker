<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JiveTalker</title>
<style>
/* The toolkit: a bar with one tab per tool. Script = a three-column editor (cast/outline/check | the lines |
   the inspector for the selected word and line); Voices = the mixer page in a frame. */
:root {
  --bg: #f3f4f7; --panel: #ffffff; --line: #d9dce4; --fg: #1d2230; --muted: #5d6476; --hover: #f7f8fb;
  --accent: #3a5bd9; --accent-soft: #e3e9fb; --accent-ink: #2c47b3; --on-accent: #ffffff;
  --warn: #a8461a; --warn-soft: #fbeadf; --ok: #2f7d4f; --ok-soft: #e1f2e7;
  --delivery: #8a3fb3; --delivery-soft: #f1e6f8; --sel-bg: #f5f7ff;
  --s0: #0f766e; --s1: #8a3fb3; --s2: #b4521e; --s3: #2c6db3; --s4: #5b6275; --s5: #a1366b;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14161c; --panel: #1c1f27; --line: #30343f; --fg: #e3e6ee; --muted: #9aa1b2; --hover: #20242d;
  --accent: #7f9bff; --accent-soft: #263055; --accent-ink: #b6c6ff; --on-accent: #10131a;
  --warn: #f0925a; --warn-soft: #3a2518; --ok: #6cc690; --ok-soft: #1b3326;
  --delivery: #cc8cf0; --delivery-soft: #33233f; --sel-bg: #1f2433;
  --s0: #4fc7b8; --s1: #cc8cf0; --s2: #f0925a; --s3: #7fb2f0; --s4: #a3aabb; --s5: #f08cbf; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14161c; --panel: #1c1f27; --line: #30343f; --fg: #e3e6ee; --muted: #9aa1b2; --hover: #20242d;
  --accent: #7f9bff; --accent-soft: #263055; --accent-ink: #b6c6ff; --on-accent: #10131a;
  --warn: #f0925a; --warn-soft: #3a2518; --ok: #6cc690; --ok-soft: #1b3326;
  --delivery: #cc8cf0; --delivery-soft: #33233f; --sel-bg: #1f2433;
  --s0: #4fc7b8; --s1: #cc8cf0; --s2: #f0925a; --s3: #7fb2f0; --s4: #a3aabb; --s5: #f08cbf; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font) }
button, select, input, textarea { font: inherit; color: inherit }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; min-height: 32px }
button:hover:not(:disabled) { border-color: var(--accent) }
button:disabled { opacity: .5; cursor: default }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600 }
button.small { min-height: 26px; padding: 1px 8px; font-size: 12px }
button.plain { border: 0; background: transparent; min-height: 0; padding: 2px 4px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input[type=text], input[type=number], select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0 }
input[type=range] { width: 100%; accent-color: var(--accent); min-width: 0 }
.mono { font-family: var(--mono) }
.hint { color: var(--muted); font-size: 12.5px }
.lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.grow { flex: 1 1 0 }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 12px var(--mono); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; min-height: 0; background: transparent }
.chip.inh { border-style: dashed; color: var(--muted) }
.chip.st { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent }
.chip.fx { background: var(--delivery-soft); color: var(--delivery); border-color: transparent }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px }
kbd { font: 600 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel) }
[hidden] { display: none !important }

/* bar */
.bar { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0 18px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5 }
.brand { display: flex; align-items: center; gap: 10px; padding: 10px 0 }
.brand b { font-size: 16px }
.tabs { display: flex; gap: 2px }
.tabs button { border: 0; border-radius: 0; background: transparent; padding: 0 14px; min-height: 50px; display: flex; flex-direction: column; justify-content: center; color: var(--muted) }
.tabs button[aria-selected=true] { color: var(--fg); box-shadow: inset 0 -3px 0 var(--accent) }
.tabs button b { font-size: 14px }
.tabs button small { font: 11px var(--mono); color: var(--muted) }
.barright { display: flex; align-items: center; gap: 10px; padding: 8px 0; flex-wrap: wrap }

/* script tab */
.subbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px 0 }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel) }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); background: transparent; padding: 4px 6px; min-height: 36px; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0 }
.seg button:last-child { border-right: 0 }
.seg button:hover { background: var(--accent-soft) }
.seg button.on { background: var(--accent); color: var(--on-accent) }
.seg button .c { font: 600 12.5px var(--mono) }
.seg button .s { font-size: 10px; opacity: .75 }
.work { display: grid; grid-template-columns: 250px minmax(0, 1fr) 370px; gap: 16px; padding: 14px 16px 40px; align-items: start }
.work.collapsed { grid-template-columns: 250px minmax(0, 1fr) 52px }
.side, .insp { position: sticky; top: 64px; max-height: calc(100vh - 76px); overflow: auto; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
@media (max-width: 1180px) {
  .work { grid-template-columns: minmax(0, 1fr) 340px } .work.collapsed { grid-template-columns: minmax(0, 1fr) 52px }
  .side { grid-column: 1 / -1; order: 3; position: static; max-height: none }
}
@media (max-width: 800px) {
  .work, .work.collapsed { grid-template-columns: minmax(0, 1fr) }
  .insp { position: static; max-height: none } .rail { flex-direction: row !important; width: auto !important }
}
.box { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px }
.castrow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center }
.dot { width: 10px; height: 10px; border-radius: 50% }
.outl { text-align: left; border: 0; background: transparent; min-height: 0; padding: 3px 4px; border-radius: 5px; display: block; width: 100% }
.outl:hover { background: var(--accent-soft) }
.prob { text-align: left; border: 0; border-radius: 8px; padding: 7px 9px; min-height: 0; display: flex; flex-direction: column; gap: 2px; width: 100% }
.prob.e { background: var(--warn-soft); color: var(--warn) }
.prob.r { background: var(--bg) }
.prob .w { font: 600 11.5px var(--mono) }

.lines { padding: 6px 0 10px }
.line { display: grid; grid-template-columns: 4px 34px minmax(0, 1fr); gap: 0 10px; padding: 8px 12px 8px 8px; margin: 0 6px; border-radius: 8px; cursor: default }
.line:hover { background: var(--hover) }
.line.sel { background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--accent) }
.rampbar { width: 3px; border-radius: 2px; background: var(--accent) }
.play { width: 32px; height: 32px; min-height: 32px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center }
.play.busy { opacity: .5; cursor: progress }
.play.fresh { border-color: var(--ok) }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 2px }
.lid { font: 12px var(--mono); color: var(--muted); border: 0; background: transparent; padding: 0; min-height: 0 }
.spk { font-weight: 600; font-size: 13px }
.status { margin-left: auto; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; color: var(--accent-ink) }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent) }
.txt { font-size: 15.5px; line-height: 1.7 }
.tok { border: 0; background: transparent; padding: 1px 2px; margin: 0 -1px; border-radius: 4px; min-height: 0; line-height: 1.5; cursor: pointer }
.tok:hover { background: var(--accent-soft) }
.tok.mk { background: var(--accent-soft); color: var(--accent-ink) }
.tok.on { background: var(--accent); color: var(--on-accent) }
.tok.unk { text-decoration: underline wavy var(--warn); text-underline-offset: 4px }
.badge { font: 600 10px var(--mono); margin-left: 2px; vertical-align: super; line-height: 0 }
.pz { font: 10.5px var(--mono); color: var(--muted); border-left: 2px solid var(--muted); border-right: 2px solid var(--muted); padding: 0 3px; margin: 0 3px; white-space: nowrap }
.cmt { color: var(--muted); font-style: italic; font-size: 12.5px }
.err { color: var(--warn); font-size: 12.5px }
.rawline { margin-top: 6px; font: 12px var(--mono); padding: 6px 10px; border-radius: 6px; background: var(--bg); overflow-x: auto; white-space: pre }
.sec { padding: 16px 20px 6px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line) }
.rampb { margin: 8px 14px 2px; padding: 6px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12.5px }
.rampb .mono { font-weight: 600; font-size: 13px }
.endb { margin: 0 14px 6px; padding: 2px 12px; font: 12px var(--mono); color: var(--muted) }
.misc { margin: 2px 14px; padding: 2px 12px; font: 12px var(--mono); color: var(--muted) }

/* inspector */
.rail { width: 52px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 12px }
.rail .vt { writing-mode: vertical-rl; border: 0; background: transparent; min-height: 0; padding: 6px; font-size: 12.5px; font-weight: 600 }
.ihead { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; min-height: 0; text-align: left }
.ihead svg { transition: transform .15s }
.ihead[aria-expanded=false] svg { transform: rotate(-90deg) }
.code { font: 13.5px var(--mono); padding: 7px 10px; border-radius: 6px; background: var(--bg); overflow-x: auto; white-space: pre }
.code .w { color: var(--accent-ink); font-weight: 600 } .code .m { color: var(--warn) }
.field { display: flex; flex-direction: column; gap: 5px }
.presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px }
.presets button { padding: 3px 2px; display: flex; flex-direction: column; align-items: center; min-height: 0; font-size: 11px }
.presets button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent) }
.curve { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 4px 4px 0 }
.curve svg { display: block; width: 100%; height: auto; cursor: ns-resize; touch-action: none; user-select: none }
.summary { padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px }
.styles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px }
.styles button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent) }
.styles button.inherited { box-shadow: inset 0 0 0 2px var(--accent); }
.fx { display: flex; align-items: center; gap: 10px; text-align: left; width: 100% }
.fx .box2 { width: 16px; height: 16px; flex: none; border-radius: 4px; border: 2px solid currentColor }
.fx.on { background: var(--delivery-soft); color: var(--delivery); border-color: transparent }
.fx.on .box2 { background: currentColor }
.srow { display: grid; grid-template-columns: 58px minmax(0, 1fr) 64px; gap: 0 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line) }
.srow input { width: 64px; padding: 3px 6px; font: 12.5px var(--mono) }
.srow .eff { grid-column: 2 / 4; font: 11px var(--mono); color: var(--muted) }
.src { font: 600 10.5px var(--font) }
.src.s-line { color: var(--accent-ink) } .src.s-cast { color: var(--delivery) } .src.s-ramp { color: var(--accent-ink) }
.chain { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 3px 8px; font: 12px var(--mono) }
.chain span:nth-child(odd) { color: var(--muted) }
.pv { display: flex; align-items: center; gap: 8px; font-size: 12.5px }

/* source */
.srcwrap { padding: 0 }
.srcbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.editor { position: relative; height: calc(100vh - 200px); min-height: 360px }
.editor pre, .editor textarea { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: 13px/1.7 var(--mono); white-space: pre; overflow: auto; tab-size: 4; border: 0 }
.editor pre { pointer-events: none; color: var(--fg) }
.editor textarea { background: transparent; color: transparent; caret-color: var(--fg); resize: none; outline: none }
.editor textarea::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: transparent }
.h-id { color: var(--muted) } .h-flag { color: var(--warn); font-weight: 600 } .h-spk { font-weight: 600 }
.h-dir { color: var(--delivery) } .h-w { color: var(--accent-ink); font-weight: 600 } .h-m { color: var(--warn) }
.h-at { color: var(--accent-ink); font-weight: 600 } .h-c { color: var(--muted); font-style: italic } .h-sec { font-weight: 700 }
.h-bad { background: var(--warn-soft) }
.complete { position: absolute; z-index: 3; width: 340px; max-height: 260px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: 12.5px }
.complete .ch { padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11.5px }
.complete .it { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; padding: 4px 10px; cursor: pointer }
.complete .it.on { background: var(--accent-soft); color: var(--accent-ink) }
.complete .it b { font: 600 12.5px var(--mono) }

#view-voices iframe { display: block; width: 100%; height: calc(100vh - 51px); border: 0; background: var(--bg) }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: min(640px, calc(100vw - 32px)); z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,.2) }
.toast.err { background: var(--warn); color: #fff }
.empty { padding: 40px; text-align: center; color: var(--muted) }
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><b>JiveTalker</b><span class="mono hint" id="folder"></span></div>
  <nav class="tabs" role="tablist" aria-label="Tools">
    <button role="tab" id="tab-script" aria-selected="true" data-tab="script"><b>Script</b><small id="tabScriptSub">voice script</small></button>
    <button role="tab" id="tab-voices" aria-selected="false" data-tab="voices"><b>Voices</b><small>mixer</small></button>
  </nav>
  <div class="grow"></div>
  <div class="barright" id="scriptActions">
    <button class="chip" id="checkChip" title="Show problems"></button>
    <span class="hint" id="renderInfo"></span>
    <button id="stopBtn" class="small" hidden>Stop</button>
    <button class="primary" id="renderBtn">Render</button>
  </div>
</header>

<main id="view-script">
  <div class="subbar">
    <span class="mono" style="font-weight:600" id="fileName"></span>
    <div class="seg" role="group" aria-label="View">
      <button id="vVisual" class="on" style="min-width:76px">Visual</button>
      <button id="vSource" style="min-width:76px">Source</button>
    </div>
    <span class="hint" id="saveState"></span>
    <div class="grow"></div>
    <button class="small" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
    <button class="small" id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
  </div>

  <div class="work" id="work">
    <aside class="side" id="side"></aside>
    <section style="min-width:0">
      <div class="card lines" id="lines"></div>
      <div class="card srcwrap" id="source" hidden>
        <div class="srcbar">
          <span class="hint" id="srcState">Saved</span>
          <div class="grow"></div>
          <span class="hint">Typing <span class="mono">(</span> after <span class="mono">[word]</span>, <span class="mono">{</span> after a speaker, or <span class="mono">@</span> lists what fits. <kbd>Ctrl</kbd>+<kbd>S</kbd> saves.</span>
          <button class="small" id="srcRevert">Revert</button>
          <button class="small primary" id="srcSave">Save</button>
        </div>
        <div class="editor" id="editor">
          <pre id="srcHl" aria-hidden="true"></pre>
          <textarea id="srcText" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Script source"></textarea>
          <div class="complete" id="complete" hidden></div>
        </div>
      </div>
    </section>
    <aside class="insp" id="insp"></aside>
  </div>
</main>

<main id="view-voices" hidden><iframe id="mixerFrame" title="Voice mixer"></iframe></main>
<audio id="player" hidden></audio>
<div class="toast" id="toast" hidden role="status"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmtNum = v => typeof v === 'string' ? v : String(Math.round(v * 1000) / 1000);
const store = {
  get(k, d) { try { const v = localStorage.getItem('jt.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jt.' + k, JSON.stringify(v)); } catch (e) {} }
};

async function api(path, body) {
  const r = await fetch(path, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json'},
                               body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.data = j; e.status = r.status; throw e; }
  return j;
}

let toastTimer = null;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 7000 : 3500);
}

// ================================================================== state
let INFO = null;        // /api/toolkit
let M = null;           // the script model (/api/script)
let LINES = [];         // line items in order
let BYID = {};          // id -> line item
let SPK = {};           // cast name -> colour index
let sel = null;         // {id, a, b}: the selected line and word range (token indices; a = null: no word)
let view = store.get('view', 'visual');
let panelOpen = store.get('panelOpen', true);
let wordOpen = store.get('wordOpen', true);
let lineOpen = store.get('lineOpen', true);
let moreSettings = store.get('moreSettings', false);
const undoStack = [], redoStack = [];
const unknown = {};     // id -> {text, words}
const previews = {};    // id -> [{key, url, seconds, take}]
const previewByKey = {};
let pending = 0;        // edits in flight
let chain = Promise.resolve();

// ================================================================== text helpers (mirror marks.py)
const MARK_RE = /\[([^\]]+)\]\(([^)]*)\)/g;
const plainOf = s => s.replace(MARK_RE, '$1');

function tokenize(text) {
  const toks = [];
  const plainSeg = (s, off) => {
    const wre = /\S+/g; let w;
    while ((w = wre.exec(s))) {
      const raw = w[0], start = off + w.index;
      const c = raw.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
      if (!c[2]) toks.push({kind: 'punct', start, end: start + raw.length, text: raw});
      else toks.push({kind: 'word', start, end: start + raw.length, cs: start + c[1].length,
                      ce: start + c[1].length + c[2].length, pre: c[1], word: c[2], post: c[3], spec: null});
    }
  };
  let pos = 0, m; MARK_RE.lastIndex = 0;
  while ((m = MARK_RE.exec(text))) {
    plainSeg(text.slice(pos, m.index), pos);
    toks.push({kind: 'word', start: m.index, end: m.index + m[0].length, cs: m.index, ce: m.index + m[0].length,
               pre: '', word: m[1], post: '', spec: m[2]});
    pos = m.index + m[0].length;
  }
  plainSeg(text.slice(pos), pos);
  toks.forEach((t, i) => { t.gap = i > 0 && /\s/.test(text.slice(toks[i - 1].end, t.start)); });
  return toks;
}

function parseSpec(spec) {
  const o = {stress: 0, stretch: 0, shorten: 0, shape: [], pause: 0, pauseS: 0, pron: null, say: null, other: ''};
  const s0 = (spec || '').trim();
  if (!s0) return o;
  if (s0[0] === '/') { o.pron = s0.replace(/^\/|\/$/g, ''); return o; }
  if (s0[0] === '=') { o.say = s0.slice(1).trim(); return o; }
  let s = s0.replace(/\s/g, '');
  const N = '-?(?:\\d+(?:\\.\\d*)?|\\.\\d+)';
  const sh = s.match(new RegExp(`\\^(${N}(?:>${N})*)`));

function wordHTML(l) {
  if (sel.a === null) return `<h3 class="lab" style="margin:0">Word</h3><div class="hint">Click a word to stress it, draw it out, shape its pitch or add a pause. Shift-click another word to mark several at once.</div>`;
  const toks = tokenize(l.text), spec = currentSpec(toks, sel.a, sel.b), o = parseSpec(spec);
  const words = plainOf(l.text.slice(toks[sel.a].cs, toks[sel.b].ce));
  const head = `<div style="display:flex;align-items:center;gap:8px">
      <button class="ihead" data-act="word" aria-expanded="${wordOpen}">${chev}<span class="lab">Word</span><span style="font-size:19px;font-weight:700">${esc(words)}</span></button>
      <div class="grow"></div><button class="small" data-act="clear" ${spec ? '' : 'disabled'}>Clear</button></div>
    <div class="code"><span class="w">[${esc(words)}]</span><span class="m">${spec ? '(' + esc(spec) + ')' : ''}</span></div>`;
  if (!wordOpen) return head;
  const sv = Math.max(-3, Math.min(3, o.stress));
  const stressBtns = [-3, -2, -1, 0, 1, 2, 3].map(v => {
    const lab = v === 3 && o.stress > 3 ? '+'.repeat(o.stress) : v > 0 ? '+'.repeat(v) : v < 0 ? '-'.repeat(-v) : '·';
    return `<button class="${sv === v && o.pron === null && o.say === null ? 'on' : ''}" data-stress="${v === 3 && o.stress > 3 ? o.stress : v}" aria-pressed="${sv === v}"><span class="c">${lab}</span></button>`;
  }).join('');
  const len = o.stretch - o.shorten;    // < shortens, ~ draws out; they don't combine
  const stretchBtns = [-3, -2, -1, 0, 1, 2, 3, 4, 5].map(v => `<button class="${len === v && o.pron === null && o.say === null ? 'on' : ''}" data-stretch="${v}"><span class="c">${v > 0 ? '~'.repeat(v) : v < 0 ? '&lt;'.repeat(-v) : '·'}</span><span class="s">${v >= 0 ? STRETCH_SUB[v] : SHORTEN_SUB[-v]}</span></button>`).join('');
  const pauseBtns = [0, 1, 2, 3, 4, 5].map(v => `<button class="${!o.pauseS && o.pause === v && o.pron === null && o.say === null ? 'on' : ''}" data-pause="${v}"><span class="c">${v ? '|'.repeat(v) : '·'}</span><span class="s">${v ? (0.2 * v).toFixed(1) + ' s' : 'none'}</span></button>`).join('');
  const cur = o.shape.map(fmtNum).join('>');
  const presets = PITCH.map(([code, name]) => {
    const pts = code ? code.split('>').map(Number) : [0];
    return `<button class="${cur === code ? 'on' : ''}" data-shape="${code}" title="${code ? '^' + code : 'no pitch mark'}">${miniCurve(pts.length === 1 ? [pts[0], pts[0]] : pts, !code)}<span>${name}</span></button>`;
  }).join('');
  const custom = cur && !PITCH.some(p => p[0] === cur) ? `<button class="on" disabled>${miniCurve(o.shape.length === 1 ? [o.shape[0], o.shape[0]] : o.shape)}<span>Custom</span></button>` : '';
  const summary = [];
  if (o.pron !== null) summary.push(`Pronounced /${o.pron}/`);
  else if (o.say !== null) summary.push(o.say ? `Says “${o.say}”; the screen still shows “${words}”` : 'Silent: not spoken, still on screen');
  else {
    if (o.stress > 0) summary.push((o.stress > 1 ? 'Strong stress' : 'Stressed') + ': lifted, louder, longer');
    if (o.stress < 0) summary.push('De-stressed: lower, quieter, shorter');
    if (o.stretch) summary.push('drawn out ' + STRETCH_SUB[Math.min(o.stretch, 5)]);
    if (o.shorten) summary.push('shortened: no sound held past ' + SHORTEN_SUB[Math.min(o.shorten, 3)].slice(1));
    if (o.shape.length) summary.push(`pitch ^${cur} semitones`);
    if (o.pause || o.pauseS) summary.push(`${o.pauseS ? fmtNum(o.pauseS) : (0.2 * o.pause).toFixed(1)} s pause after`);
    if (o.other) summary.push(`unknown mark “${o.other}”`);
  }
  return head + `
    <div class="field"><span class="lab">Stress</span><div class="seg">${stressBtns}</div><div class="hint">${STRESS_HINT[String(o.stress)] || ''}</div></div>
    <div class="field"><span class="lab">Length</span><div class="seg">${stretchBtns}</div><div class="hint">~ draws the word out. &lt; shortens it: no sound held past the limit, for a word the model drags out (a held vowel that fades into a gap).</div></div>
    <div class="field"><span class="lab">Pitch shape</span><div class="presets">${presets}${custom}</div>
      <div class="curve" id="curveBox"></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button class="small" data-act="addpt" ${o.shape.length >= 6 ? 'disabled' : ''}>+ point</button>
        <button class="small" data-act="delpt" ${o.shape.length <= 1 ? 'disabled' : ''}>− point</button>
        <span class="mono grow" style="text-align:right;font-size:12.5px;color:var(--accent-ink)" id="curveCode">${cur ? '^' + esc(cur) : 'no pitch mark'}</span></div>
      <div class="hint">Drag the points up or down (half-semitone steps). One point shifts the whole word; more glide between them. Adds to the word's own melody and any stress.</div></div>
    <div class="field"><span class="lab">Pause after</span><div class="seg">${pauseBtns}</div>
      <label class="hint" style="display:flex;align-items:center;gap:8px">or exactly <input type="number" min="0" max="5" step="0.1" data-input="pauses" value="${o.pauseS || ''}" placeholder="s" style="width:70px"> seconds</label></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <label class="field"><span class="lab">Pronounce (IPA)</span><input type="text" data-input="pron" value="${esc(o.pron ?? '')}" placeholder="ʃɪvˈɔn" class="mono"></label>
      <label class="field"><span class="lab">Say instead</span><input type="text" data-input="say" value="${esc(o.say ?? '')}" placeholder="Doctor"></label>
    </div>
    <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-input="silent" ${o.say === '' ? 'checked' : ''}> Silent (on screen, not spoken)</label>
    <div class="hint" style="font-size:12px">A word holds marks or a respelling, not both.</div>
    <div class="summary">${esc(summary.join(' · ') || 'Plain: said as written.')}</div>
    <div class="hint" style="font-size:12px">Keys: <kbd>+</kbd> <kbd>-</kbd> stress, <kbd>~</kbd> draw out, <kbd>&lt;</kbd> shorten, <kbd>|</kbd> pause, <kbd>^</kbd> pitch shapes, <kbd>0</kbd> clear, <kbd>←</kbd> <kbd>→</kbd> next word (<kbd>Shift</kbd> to extend), <kbd>↑</kbd> <kbd>↓</kbd> next line, <kbd>Space</kbd> play, <kbd>Esc</kbd> deselect.</div>`;
}
function miniCurve(pts, dim) {
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${(3 + 30 * i / (pts.length - 1)).toFixed(1)} ${(10 - v * 2.2).toFixed(1)}`).join(' ');
  return `<svg width="36" height="20" viewBox="0 0 36 20" aria-hidden="true"><path d="M3 10 L33 10" stroke="currentColor" stroke-opacity=".2"/><path d="${d}" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" ${dim ? 'stroke-opacity=".35"' : ''}/></svg>`;
}

// the pitch curve: points spread evenly across the word, dragged in half-semitone steps
function drawCurve(pts, neutral) {
  const box = $('#curveBox'); if (!box) return;
  const lim = Math.max(4, Math.ceil(Math.max(...pts.map(Math.abs))));
  const W = 300, H = 130, cy = v => 60 - v * (50 / lim), n = pts.length;
  const cx = i => n === 1 ? 159 : 30 + 258 * i / (n - 1);
  const grid = [lim, lim / 2, 0, -lim / 2, -lim].map(v => `<line x1="26" x2="292" y1="${cy(v)}" y2="${cy(v)}" stroke="currentColor" stroke-opacity="${v === 0 ? .35 : .12}" ${v ? 'stroke-dasharray="3 4"' : ''}/><text x="20" y="${cy(v) + 3}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".55" font-family="monospace">${v > 0 ? '+' : ''}${fmtNum(v)}</text>`).join('');
  const path = n === 1 ? `M30 ${cy(pts[0])} L288 ${cy(pts[0])}` : pts.map((v, i) => `${i ? 'L' : 'M'}${cx(i).toFixed(1)} ${cy(v).toFixed(1)}`).join(' ');
  const dots = pts.map((v, i) => `<circle cx="${cx(i)}" cy="${cy(v)}" r="7" fill="${neutral ? 'var(--panel)' : 'var(--accent)'}" stroke="var(--accent)" stroke-width="2"/>${neutral ? '' : `<text x="${cx(i)}" y="${v >= lim - 1 ? cy(v) + 21 : cy(v) - 12}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--accent-ink)" font-family="monospace">${v > 0 ? '+' : ''}${fmtNum(v)}</text>`}`).join('');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pitch curve: drag the points up or down"><g style="color:var(--fg)">${grid}</g><path d="${path}" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" ${neutral ? 'stroke-opacity=".35"' : ''}/>${dots}<text x="159" y="126" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".55">start of the word → end</text></svg>`;
  return {lim, cx, n};
}
function bindCurve() {
  const l = sel && BYID[sel.id]; if (!l || sel.a === null || !$('#curveBox')) return;
  const o = parseSpec(currentSpec(tokenize(l.text), sel.a, sel.b));
  const neutral = !o.shape.length;
  let pts = neutral ? [0, 0] : o.shape.slice();
  let g = drawCurve(pts, neutral), drag = null;
  const svgOf = () => $('#curveBox svg');
  const valueAt = e => {
    const r = svgOf().getBoundingClientRect(), y = (e.clientY - r.top) / r.height * 130;
    return Math.max(-g.lim, Math.min(g.lim, Math.round((60 - y) / (50 / g.lim) * 2) / 2)) + 0;
  };
  const box = $('#curveBox');
  box.onpointerdown = e => {
    if (!svgOf()) return;
    const r = svgOf().getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 300;
    let best = 0; for (let i = 1; i < g.n; i++) if (Math.abs(g.cx(i) - x) < Math.abs(g.cx(best) - x)) best = i;
    drag = best; box.setPointerCapture(e.pointerId);
    pts[drag] = valueAt(e); g = drawCurve(pts, false); $('#curveCode').textContent = '^' + pts.map(fmtNum).join('>');
  };
  box.onpointermove = e => {
    if (drag === null) return;
    const v = valueAt(e); if (v === pts[drag]) return;
    pts[drag] = v; g = drawCurve(pts, false); $('#curveCode').textContent = '^' + pts.map(fmtNum).join('>');
  };
  box.onpointerup = box.onpointercancel = () => {
    if (drag === null) return; drag = null;
    const shape = pts.slice();
    editMark(o2 => { clearForm(o2); o2.shape = shape; });
  };
}
function resample(p, k) {
  if (k === 1) return [Math.round(p.reduce((a, b) => a + b, 0) / p.length * 2) / 2];
  if (p.length === 1) p = [p[0], p[0]];
  const out = [];
  for (let j = 0; j < k; j++) {
    const t = j / (k - 1) * (p.length - 1), i0 = Math.floor(t), i1 = Math.min(i0 + 1, p.length - 1);
    out.push(Math.round((p[i0] + (p[i1] - p[i0]) * (t - i0)) * 2) / 2 + 0);
  }
  return out;
}

function lineInspHTML(l) {
  const head = `<button class="ihead" data-act="line" aria-expanded="${lineOpen}" style="flex-wrap:wrap">${chev}<span class="lab">Line</span><span class="mono" style="font-weight:600">${esc(l.id)}</span><span style="font-weight:600;color:var(--s${SPK[l.who] ?? 4})">${esc(l.speaker)}</span></button>`;
  if (!lineOpen) return head;
  if (!l.settings) return head + `<div class="err">${l.errors.map(esc).join('<br>')}</div><div class="hint">Fix the line in Source (or its direction below).</div>
    <label class="field"><span class="lab">Direction</span><input type="text" class="mono" data-input="direction" value="${esc(l.direction)}"></label>`;
  const srcTag = s => `<span class="src ${s === 'line' ? 's-line' : s.includes('cast') ? 's-cast' : s.includes('ramp') ? 's-ramp' : ''}">${esc(s)}</span>`;
  const styleBtns = STYLE_NAMES.map(n => {
    const on = l.style === n, own = l.own_style === n;
    return `<button class="${on && own ? 'on' : on ? 'inherited' : ''}" data-style="${n}" aria-pressed="${on}">${n}</button>`;
  }).join('');
  const trance = l.style === 'trance';
  const fx = EFFECTS.map(([n, h]) => {
    const e = (l.effects || []).find(x => x.name === n), inh = e && e.src !== 'line';
    return `<button class="fx${e ? ' on' : ''}" data-fx="${n}" ${inh ? 'disabled' : ''}><span class="box2"></span><span style="display:flex;flex-direction:column"><b class="mono" style="font-size:13px">${n}</b><span style="font-size:12px;opacity:.85">${h}${inh ? ' · from ' + esc(e.src) : ''}</span></span></button>`;
  }).join('');
  const rows = SETTINGS.slice(0, moreSettings ? SETTINGS.length : 6).map(([n, hint, step]) => {
    const s = l.settings[n], own = l.own_settings[n];
    let eff = s.value === null ? (l.rises.length ? l.rises.map(r => r ? `+${fmtNum(r)}` : 'falls').join(', ') + ' (auto)' : 'no question') : fmtNum(s.value);
    if (n === 'volume' && l.level_db !== s.value) eff += ` (level ${fmtNum(l.level_db)} dB)`;
    return `<div class="srow"><span class="mono" style="font-weight:600;font-size:13px">${n}</span><span class="hint" style="font-size:12px">${hint}</span>
      <input type="number" step="${step}" data-setting="${n}" value="${own ?? ''}" placeholder="—" aria-label="${n} for this line">
      <span class="eff">now ${esc(eff)} · ${srcTag(s.src)}</span></div>`;
  }).join('');
  const take = l.settings.take.value || 0;
  const takeBtns = [0, 1, 2, 3, 4, 5].map(v => `<button class="${take === v ? 'on' : ''}" data-take="${v}"><span class="c">${v}</span></button>`).join('');
  const pv = (previews[l.id] || []).map((p, i) => `<div class="pv"><button class="small" data-pv="${i}">Play</button><span class="grow">take ${p.take}${p.key === l.key ? '' : ' · older version'}</span><span class="mono hint">${p.seconds} s</span></div>`).join('');
  const cast = M.cast.find(c => c.name === l.who);
  const layer = (k, label) => `<span>${label}</span><span style="${l.layers[k] ? '' : 'color:var(--muted)'}">${esc(l.layers[k] || '—')}${k === '@ramp' && l.ramp && l.ramp.value === null ? esc(`ramp is for ${l.ramp.for}: not applied`) : ''}${k === '@ramp' && l.ramp && l.ramp.value !== null && l.own_style ? ' (the line\'s style wins)' : ''}</span>`;
  return head + `
    <div class="field"><div style="display:flex;align-items:baseline;gap:8px"><span class="lab">Style</span>${srcTag(l.style_src)}<div class="grow"></div>${l.own_style ? '<button class="small" data-act="inheritstyle">Inherit</button>' : ''}</div>
      <div class="styles">${styleBtns}</div><div class="hint">${STYLE_HINT[l.style] || ''}</div>
      ${trance ? `<div style="display:flex;align-items:center;gap:10px"><span class="hint">Depth</span><input type="range" min="0" max="1" step="0.05" value="${l.depth ?? 0.5}" data-input="depth" ${l.own_style === 'trance' ? '' : 'disabled title="set by the ramp: pick trance to set it here"'} aria-label="Trance depth"><span class="mono" style="font-size:12px;width:36px;text-align:right" id="depthVal">${fmtNum(l.depth ?? 0.5)}</span></div>` : ''}</div>
    <div class="field"><span class="lab">Effects</span>${fx}</div>
    <div class="field"><span class="lab">Settings <span style="text-transform:none;letter-spacing:0;font-weight:400">(empty = inherited)</span></span><div>${rows}</div>
      <button class="small" data-act="more" style="align-self:flex-start">${moreSettings ? 'Fewer settings' : 'More: volume, drift, floor, breath'}</button></div>
    <div class="field"><span class="lab">Take</span><div style="display:flex;gap:8px;align-items:center"><div class="seg grow">${takeBtns}</div><button class="primary" data-act="preview">Preview</button></div>
      <div class="hint" style="font-size:12px">A take is a different variation of the same line; try takes until one sounds right.</div>${pv}</div>
    <div class="field"><span class="lab">How this line resolves</span><div class="chain">${layer('@defaults', '@defaults')}${layer('@cast', '@cast')}${layer('@ramp', '@ramp')}${layer('line', 'line')}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${cast && cast.source ? `<button class="small" data-act="tune">Tune ${esc(cast.voice)} in Voices</button>` : ''}<span class="hint">${l.status === 'cached' ? 'Clip up to date.' : l.status === 'render' ? 'Needs a render.' : l.status === 'reuse' ? 'Its clip is there under another name.' : ''}</span></div>`;
}

const insp = $('#insp');
insp.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const l = sel && BYID[sel.id];
  const act = b.dataset.act;
  if (act === 'panel') { panelOpen = !panelOpen; store.set('panelOpen', panelOpen); return renderInsp(); }
  if (act === 'openword') { panelOpen = wordOpen = true; store.set('panelOpen', true); store.set('wordOpen', true); return renderInsp(); }
  if (act === 'openline') { panelOpen = lineOpen = true; store.set('panelOpen', true); store.set('lineOpen', true); return renderInsp(); }
  if (act === 'word') { wordOpen = !wordOpen; store.set('wordOpen', wordOpen); return renderInsp(); }
  if (act === 'line') { lineOpen = !lineOpen; store.set('lineOpen', lineOpen); return renderInsp(); }
  if (act === 'more') { moreSettings = !moreSettings; store.set('moreSettings', moreSettings); return renderInsp(); }
  if (!l) return;
  if (act === 'clear') return editMark(() => parseSpec(''));
  if (b.dataset.stress !== undefined) return editMark(o => { clearForm(o); o.stress = +b.dataset.stress; });
  if (b.dataset.stretch !== undefined) return editMark(o => { clearForm(o); const v = +b.dataset.stretch; o.stretch = Math.max(v, 0); o.shorten = Math.max(-v, 0); });
  if (b.dataset.pause !== undefined) return editMark(o => { clearForm(o); o.pause = +b.dataset.pause; o.pauseS = 0; });
  if (b.dataset.shape !== undefined) return editMark(o => { clearForm(o); o.shape = b.dataset.shape ? b.dataset.shape.split('>').map(Number) : []; });
  if (act === 'addpt' || act === 'delpt') return editMark(o => {
    clearForm(o); const p = o.shape.length ? o.shape : [0, 0];
    o.shape = resample(p, p.length + (act === 'addpt' ? 1 : -1));
  });
  if (b.dataset.style) {
    const n = b.dataset.style;
    return editLine(l.id, x => ({direction: dirSetStyle(x.direction, n, n === 'trance' ? (x.depth ?? 0.5) : null)}));
  }
  if (act === 'inheritstyle') return editLine(l.id, x => ({direction: dirSetStyle(x.direction, null)}));
  if (b.dataset.fx) return editLine(l.id, x => ({direction: dirToggle(x.direction, b.dataset.fx)}));
  if (b.dataset.take !== undefined) return editLine(l.id, x => ({direction: dirSet(x.direction, 'take', +b.dataset.take ? +b.dataset.take : null)}));
  if (act === 'preview') return previewLine(l.id, true);
  if (b.dataset.pv !== undefined) return playUrl(previews[l.id][+b.dataset.pv].url);
  if (act === 'tune') { const c = M.cast.find(c => c.name === l.who); return openVoices(c.source, l); }
});
insp.addEventListener('change', e => {
  const t = e.target, l = sel && BYID[sel.id]; if (!l) return;
  const k = t.dataset.input;
  if (t.dataset.setting) {
    const v = t.value.trim();
    if (v !== '' && !isFinite(+v)) return toast('A number, please', true);
    return editLine(l.id, x => ({direction: dirSet(x.direction, t.dataset.setting, v === '' ? null : fmtNum(+v))}));
  }
  if (k === 'depth') return editLine(l.id, x => ({direction: dirSetStyle(x.direction, 'trance', +t.value)}));
  if (k === 'direction') return editLine(l.id, () => ({direction: t.value.trim()}));
  if (k === 'pauses') return editMark(o => { clearForm(o); o.pauseS = Math.max(0, Math.min(5, +t.value || 0)); o.pause = 0; });
  if (k === 'pron') return editMark(o => { const v = t.value.trim().replace(/^\/|\/$/g, ''); const z = parseSpec(''); if (v) z.pron = v; return z; });
  if (k === 'say') return editMark(() => { const z = parseSpec(''); if (t.value.trim()) z.say = t.value.trim(); return z; });
  if (k === 'silent') return editMark(() => { const z = parseSpec(''); if (t.checked) z.say = ''; return z; });
});
insp.addEventListener('input', e => { if (e.target.dataset.input === 'depth') $('#depthVal').textContent = fmtNum(+e.target.value); });

// ================================================================== playback
let wakeCtx = null;     // keeps the sound output awake (see mixer.html)
function keepAudioAwake() {
  try {
    if (!wakeCtx) { wakeCtx = new AudioContext(); const s = wakeCtx.createConstantSource(); s.offset.value = 1 / 32768; s.connect(wakeCtx.destination); s.start(); }
    if (wakeCtx.state === 'suspended') wakeCtx.resume().catch(() => {});
  } catch (e) {}
}
for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, keepAudioAwake, {capture: true});
function playUrl(url) { const p = $('#player'); p.src = url; p.play().catch(e => toast('Could not play: ' + e.message, true)); }
function b64wav(b64) { const s = atob(b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return URL.createObjectURL(new Blob([a], {type: 'audio/wav'})); }
function playLine(id, btn) {
  const l = BYID[id]; if (!l) return;
  if (l.status === 'cached' && l.clip) return playUrl('/clips/' + encodeURIComponent(l.clip));
  return previewLine(id, false, btn);
}
async function previewLine(id, force, btn) {
  const l = BYID[id]; if (!l) return;
  if (l.status === 'error') return toast(`${id} has a problem to fix first`, true);
  if (!force && l.key && previewByKey[l.key]) return playUrl(previewByKey[l.key].url);
  btn = btn || document.querySelector(`.line[data-id="${CSS.escape(id)}"] [data-play]`);
  if (btn) btn.classList.add('busy');
  try {
    const key = l.key, take = l.settings ? l.settings.take.value : 0;
    const res = await api('/api/script/preview', {id});
    const p = {key, url: b64wav(res.audio), seconds: res.seconds, take};
    previewByKey[key] = p; (previews[id] = previews[id] || []).unshift(p); previews[id].length = Math.min(previews[id].length, 8);
    playUrl(p.url);
    if (res.unknown.length) { unknown[id] = {text: l.text, words: res.unknown}; renderSide(); }
    if (res.unplaced.length) toast(`The mark on “${res.unplaced.join('”, “')}” did not land on a word`, true);
    renderLines(); renderInsp();
  } catch (e) { toast(e.message, true); }
  finally { if (btn) btn.classList.remove('busy'); }
}

// words the phonemizer can't read: checked in the background, a few lines at a time
let wordsBusy = false;
async function checkWords() {
  if (wordsBusy) return; wordsBusy = true;
  try {
    for (;;) {
      const todo = LINES.filter(l => l.status !== 'error' && !(unknown[l.id] && unknown[l.id].text === l.text)).slice(0, 20);
      if (!todo.length) break;
      const texts = Object.fromEntries(todo.map(l => [l.id, l.text]));
      const res = await api('/api/script/words', {ids: todo.map(l => l.id)});
      let found = false;
      for (const id of Object.keys(texts)) { unknown[id] = {text: texts[id], words: res[id] || []}; if ((res[id] || []).length) found = true; }
      for (const id of Object.keys(texts)) if (!(id in res)) unknown[id] = {text: texts[id], words: []};
      if (found) { renderSide(); renderLines(); }
    }
  } catch (e) {} finally { wordsBusy = false; }
}

// ================================================================== rendering the script
let job = {running: false};
$('#renderBtn').onclick = async () => {
  try { job = await api('/api/script/render', {}); renderJob(); pollJob(); }
  catch (e) { toast(e.message, true); }
};
$('#stopBtn').onclick = () => api('/api/script/render/stop', {}).then(() => toast('Stopping after this clip…'));
function renderJob() {
  const rb = $('#renderBtn');
  rb.disabled = true; rb.textContent = job.total ? `Rendering ${job.done}/${job.total}…` : 'Rendering…';
  $('#renderInfo').textContent = (job.log || []).slice(-1)[0] || '';
  $('#stopBtn').hidden = false;
}
async function pollJob() {
  for (;;) {
    await new Promise(r => setTimeout(r, 1000));
    try { job = await api('/api/script/render'); } catch (e) { continue; }
    if (job.running) { renderJob(); continue; }
    await loadModel();
    const s = job.summary;
    if (job.error) toast('Render failed: ' + job.error, true);
    else if (s) toast(s.interrupted ? 'Stopped: finished clips are kept.' : `Done: ${s.render} rendered, ${s.reused} reused, ${s.cached} up to date.` + (s.warnings.length ? ' ' + s.warnings.join(' · ') : ''), !!s.warnings.length);
    return;
  }
}

// ================================================================== source view
const ta = $('#srcText'), hl = $('#srcHl');
let srcDirty = false;
function setSource(text) { ta.value = text.replace(/\r\n/g, '\n'); paintSource(); srcDirty = false; $('#srcState').textContent = 'Saved'; }
function hlLine(line) {
  const s = line.trimStart(), ind = esc(line.slice(0, line.length - s.length));
  if (!s) return esc(line);
  if (s[0] === '#') return `${ind}<span class="h-c">${esc(s)}</span>`;
  if (/^==.*==$/.test(s)) return `${ind}<span class="h-sec">${esc(s)}</span>`;
  if (s[0] === '@') {
    const m = s.match(/^(@\S*)(.*)$/), rest = m[2].replace(/(\{[^}]*\})/g, '\u0000$1\u0001');
    return `${ind}<span class="h-at">${esc(m[1])}</span>` + esc(rest).replace(/\u0000(.*?)\u0001/g, '<span class="h-dir">$1</span>');
  }
  const m = s.match(/^(\S+)(\s+)((?:![\w-]+\s+)*)([^{:]+?)(\s*\{[^}]*\})?(\s*:\s?)(.*)$/);
  if (!m) return `${ind}<span class="h-bad">${esc(s)}</span>`;
  return `${ind}<span class="h-id">${esc(m[1])}</span>${esc(m[2])}<span class="h-flag">${esc(m[3])}</span><span class="h-spk">${esc(m[4])}</span><span class="h-dir">${esc(m[5] || '')}</span>${esc(m[6])}` +
    esc(m[7]).replace(/(\[[^\]]+\])(\([^)]*\))/g, '<span class="h-w">$1</span><span class="h-m">$2</span>');
}
function paintSource() { hl.innerHTML = ta.value.split('\n').map(hlLine).join('\n') + '\n'; hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; }
ta.addEventListener('scroll', () => { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; closeComplete(); });
ta.addEventListener('input', () => { paintSource(); srcDirty = ta.value !== M.text.replace(/\r\n/g, '\n'); $('#srcState').textContent = srcDirty ? 'Unsaved changes' : 'Saved'; complete(); });
ta.addEventListener('click', () => closeComplete());
async function saveSource() {
  if (!srcDirty) return true;
  try {
    const before = M.text;
    setModel(await api('/api/script/text', {base: M.version, text: ta.value}));
    undoStack.push(before); redoStack.length = 0; srcDirty = false; $('#srcState').textContent = 'Saved'; saveState();
    return true;
  } catch (e) {
    if (e.data && e.data.conflict) {
      if (confirm('The file changed on disk since you started editing here. Replace it with your version? (Cancel keeps your text here so you can copy it.)')) {
        M.version = e.data.model.version; M.text = e.data.model.text; return saveSource();
      }
      return false;
    }
    toast(e.message, true); return false;
  }
}
$('#srcSave').onclick = saveSource;
$('#srcRevert').onclick = () => { if (!srcDirty || confirm('Drop your unsaved changes?')) setSource(M.text); };
function gotoSourceLine(n) {
  if (!n) return;
  const lines = ta.value.split('\n'); let pos = 0;
  for (let i = 0; i < n - 1 && i < lines.length; i++) pos += lines[i].length + 1;
  ta.focus(); ta.setSelectionRange(pos, pos + (lines[n - 1] || '').length);
  const lh = parseFloat(getComputedStyle(ta).lineHeight); ta.scrollTop = Math.max(0, (n - 4) * lh);
}

// completion: what fits at the caret
const MARK_ITEMS = [['+', 'stress: a pitch lift, a little louder and longer'], ['++', 'strong stress'], ['-', 'de-stress: lower, quieter, shorter'],
  ['--', 'stronger de-stress'], ['~', 'drawn out ×1.25'], ['~~', 'drawn out ×1.5'], ['<', 'shortened: no sound held past 0.15 s'], ['<<', 'shortened more: 0.10 s'], ['+~', 'stressed and drawn out (marks combine)'],
  ['^1.5', 'shift the pitch by semitones'], ['^2>-1', 'pitch glide: start 2 up, end 1 down'], ['^0>3>0', 'pitch arc'],
  ['|', 'pause after: 0.2 s (||| = 0.6 s, up to |||||)'], ['|0.8', 'pause after: exactly 0.8 s'], ['//', 'pronounce: IPA between the slashes'], ['=', 'say different words (nothing after = is silent)']];
const DIR_ITEMS = [...STYLE_NAMES.map(n => [n === 'trance' ? 'trance 0.6' : n, STYLE_HINT[n]]), ...EFFECTS,
  ...SETTINGS.map(([n, h]) => [n + ' ', h]), ['take ', 'a different variation of the line'],
  ['lang ja', 'the language spoken: en (default) or ja']];
const AT_ITEMS = [['@cast ', 'Name = voice | aliases {direction}'], ['@defaults ', 'a direction for every line'], ['@voices ', 'the folder voice names are looked up in'],
  ['@pronounce ', 'Word = /ipa/'], ['@ramp trance 0.2 -> 1.0', 'change trance or a setting across one speaker\'s lines'], ['@end', 'ends a ramp']];
let comp = null;
function complete() {
  const pos = ta.selectionStart; if (pos !== ta.selectionEnd) return closeComplete();
  const lineStart = ta.value.lastIndexOf('\n', pos - 1) + 1, before = ta.value.slice(lineStart, pos);
  let m, items, typed, title;
  if ((m = before.match(/\]\(([^)\s]*)$/))) { typed = m[1]; items = MARK_ITEMS; title = 'Word marks'; }
  else if (!before.trimStart().startsWith('@') && (m = before.match(/\{([^}]*)$/))) { typed = m[1].split(',').pop().trimStart(); items = DIR_ITEMS; title = 'Direction: style, effects, settings'; }
  else if ((m = before.match(/^\s*(@\w*)$/))) { typed = m[1]; items = AT_ITEMS; title = 'Header lines'; }
  else return closeComplete();
  const list = items.filter(([c]) => c.startsWith(typed) && c !== typed);
  if (!list.length) return closeComplete();
  comp = {list, typed, i: 0};
  const box = $('#complete');
  box.innerHTML = `<div class="ch">${title} · <kbd>Enter</kbd> inserts, <kbd>Esc</kbd> closes</div>` + list.map(([c, h], i) => `<div class="it${i ? '' : ' on'}" data-i="${i}"><b>${esc(c.trim())}</b><span>${esc(h)}</span></div>`).join('');
  const cs = getComputedStyle(ta), lh = parseFloat(cs.lineHeight);
  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = cs.font;
  const row = ta.value.slice(0, pos).split('\n').length - 1;
  const x = parseFloat(cs.paddingLeft) + ctx.measureText(before).width - ta.scrollLeft;
  const y = parseFloat(cs.paddingTop) + (row + 1) * lh - ta.scrollTop + 4;
  box.style.left = Math.max(4, Math.min(x, ta.clientWidth - 350)) + 'px'; box.style.top = y + 'px'; box.hidden = false;
}
function closeComplete() { comp = null; $('#complete').hidden = true; }
function accept(i) {
  const [code] = comp.list[i], pos = ta.selectionStart;
  ta.setRangeText(code, pos - comp.typed.length, pos, 'end');
  if (code === '//') ta.setSelectionRange(ta.selectionStart - 1, ta.selectionStart - 1);
  closeComplete(); ta.dispatchEvent(new Event('input')); closeComplete(); ta.focus();
}
$('#complete').addEventListener('mousedown', e => { const it = e.target.closest('.it'); if (it) { e.preventDefault(); accept(+it.dataset.i); } });
ta.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveSource(); return; }
  if (!comp) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); comp.i = (comp.i + (e.key === 'ArrowDown' ? 1 : comp.list.length - 1)) % comp.list.length;
    document.querySelectorAll('#complete .it').forEach((el, i) => el.classList.toggle('on', i === comp.i));
    document.querySelector('#complete .it.on').scrollIntoView({block: 'nearest'});
  } else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); accept(comp.i); }
  else if (e.key === 'Escape') { e.preventDefault(); closeComplete(); }
});

async function setView(v) {
  if (v === view) return;
  if (view === 'source' && srcDirty && !(await saveSource())) return;
  view = v; store.set('view', v);
  $('#vVisual').classList.toggle('on', v === 'visual'); $('#vSource').classList.toggle('on', v === 'source');
  $('#lines').hidden = v !== 'visual'; $('#source').hidden = v !== 'source';
  if (v === 'source') { setSource(M.text); const l = sel && BYID[sel.id]; if (l) gotoSourceLine(l.lineno); }
  else renderLines();
}
$('#vVisual').onclick = () => setView('visual'); $('#vSource').onclick = () => setView('source');

// ================================================================== keys (Visual)
document.addEventListener('keydown', e => {
  if ($('#view-script').hidden || view !== 'visual' || !M) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if (mod && k.toLowerCase() === 'y') { e.preventDefault(); return redo(); }
  if (mod || e.altKey || !sel) return;
  const l = BYID[sel.id]; if (!l) return;
  const toks = tokenize(l.text), words = toks.map((t, i) => t.kind === 'word' ? i : -1).filter(i => i >= 0);
  const hasWord = sel.a !== null;
  const step = (dir, extend) => {
    if (!words.length) return;
    if (!hasWord) return select(l.id, words[dir > 0 ? 0 : words.length - 1], words[dir > 0 ? 0 : words.length - 1]);
    const edge = dir > 0 ? sel.b : sel.a, j = words.indexOf(edge) + dir;
    if (j < 0 || j >= words.length) return;
    if (extend) select(l.id, dir > 0 ? sel.a : words[j], dir > 0 ? words[j] : sel.b); else select(l.id, words[j], words[j]);
  };
  const lineStep = dir => {
    const i = LINES.indexOf(l) + dir; if (i < 0 || i >= LINES.length) return;
    const n = LINES[i], nw = tokenize(n.text).map((t, x) => t.kind === 'word' ? x : -1).filter(x => x >= 0);
    if (hasWord && nw.length) { const w = nw[Math.min(words.indexOf(sel.a), nw.length - 1)]; select(n.id, w, w); } else select(n.id, null, null);
  };
  const keys = {
    ArrowRight: () => step(1, e.shiftKey), ArrowLeft: () => step(-1, e.shiftKey), ArrowDown: () => lineStep(1), ArrowUp: () => lineStep(-1),
    ' ': () => playLine(l.id), p: () => previewLine(l.id, true),
    Escape: () => hasWord && select(l.id, null, null)
  };
  if (hasWord) Object.assign(keys, {
    '+': () => editMark(o => { clearForm(o); o.stress = Math.min(5, o.stress + 1); }), '=': () => keys['+'](),
    '-': () => editMark(o => { clearForm(o); o.stress = Math.max(-3, o.stress - 1); }), '_': () => keys['-'](),
    '~': () => editMark(o => { clearForm(o); o.shorten = 0; o.stretch = (o.stretch + 1) % 6; }), '`': () => keys['~'](),
    '<': () => editMark(o => { clearForm(o); o.stretch = 0; o.shorten = (o.shorten + 1) % 4; }), ',': () => keys['<'](),
    '|': () => editMark(o => { clearForm(o); o.pauseS = 0; o.pause = (o.pause + 1) % 6; }), '\\': () => keys['|'](),
    '^': () => editMark(o => { clearForm(o); const c = o.shape.map(fmtNum).join('>'), i = PITCH.findIndex(p => p[0] === c); const nx = PITCH[(i + 1) % PITCH.length][0]; o.shape = nx ? nx.split('>').map(Number) : []; }),
    '0': () => editMark(() => parseSpec('')), Delete: () => keys['0'](), Backspace: () => keys['0']()
  });
  if (keys[k]) { e.preventDefault(); keys[k](); }
});

// ================================================================== start
(async () => {
  try {
    INFO = await api('/api/toolkit');
    if (INFO.script) await loadModel();
    else {
      $('#tab-script').disabled = true; $('#tab-script').title = 'Start with: jivetalker edit voice_script.txt';
      $('#tabScriptSub').textContent = 'no script open'; $('#folder').textContent = '';
    }
    if (INFO.script) { const want = view; view = 'visual'; await setView(want); }
    saveState();
    const want = location.hash.slice(1);
    showTab(want === 'voices' || want === 'script' ? want : INFO.start);
    try { const s = await api('/api/script/render'); if (s.running) { job = s; renderJob(); pollJob(); } } catch (e) {}
  } catch (e) { document.body.insertAdjacentHTML('beforeend', `<div class="empty">Could not reach JiveTalker: ${esc(e.message)}</div>`); }
})();
</script>
