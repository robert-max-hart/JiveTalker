[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jivetalker"
version = "0.1.0"
description = "Directed voice lines from Kokoro TTS: styles, word stress, variation, effects"
requires-python = ">=3.10"
dependencies = [
    "kokoro==0.9.4",          # engine.py re-implements part of KModel; other versions are refused
    "misaki[en]==0.9.4",
    "torch>=2.6",             # torch.load(weights_only=True)
    "numpy",
    "scipy",
    "librosa",
    "soundfile>=0.12",        # wheels bundle libsndfile with Ogg Opus
]

[project.scripts]
jivetalker = "jivetalker.cli:main"

[tool.setuptools]
packages = ["jivetalker", "jivetalker.lang"]

[tool.setuptools.package-data]
jivetalker = ["mixer.html", "toolkit.html"]
